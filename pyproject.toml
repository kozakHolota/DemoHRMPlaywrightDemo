[project]
name = "demohrmplaywrightdemo"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "playwright>=1.52.0",
    "pytest>=8.4.0",
    "pytest-playwright>=0.7.0",
    "pytest-asyncio>=1.0.0",
    "python-dotenv>=1.1.0",
    "faker>=37.3.0",
    "pytest-html>=4.1.0",
]

[tool.pytest.ini_options]
addopts = "--html=reports/report.html --self-contained-html"
